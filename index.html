<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container, #help-card {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #3B2C7F;
            color: white;
            font-family: 'Poppins, sans-serif';
            font-weight: 600;
            cursor: pointer;
        }
        #chat-container img, #help-card img {
            width: 45px;
            height: 45px;
            margin-left: 10px;
        }
        #chat-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        #chat-modal .chat-content {
            width: 400px;
            height: 500px;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .header {
            background-color: #0b5394;
            color: #ffffff;
            text-align: center;
            padding: 10px 0;
            font-weight: 500;
            position: relative;
        }
        .chat-box {
            height: 400px;
            padding: 10px;
            overflow-y: auto;
            border-bottom: 1px solid #e0e0e0;
            flex-grow: 1;
        }
        .input-container {
            display: flex;
            padding: 10px;
            background-color: #ffffff;
        }
        .user-message, .bot-message {
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
            max-width: 75%;
        }
        .user-message {
            background-color: #d9edf7;
            align-self: flex-end;
            text-align: right;
        }
        .bot-message {
            background-color: #EFDEAF;
        }
        .close-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            color: white;
            cursor: pointer;
        }
        #user-input, #modal-user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #0d5fac;
            border-radius: 5px;
        }
        #send-btn, #modal-send-btn {
            background-color: #E8724F;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            margin-left: 10px;
            cursor: pointer;
        }
        #send-btn:hover, #modal-send-btn:hover {
            background-color: #0d5fac;
        }
    </style>
</head>
<body>
<div id="chat-container">
    <span>Need Help?</span>
    <img src="chatBot.png" alt="ChatBot Logo">
</div>

<div id="chat-modal">
    <div class="chat-content">
        <div class="header">
            NSE Chatbot
            <span class="close-btn">&times;</span>
        </div>
        <div class="chat-box"></div>
        <div class="input-container">
            <input type="text" id="modal-user-input" placeholder="Type a message..." />
            <button id="modal-send-btn">Send</button>
        </div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const chatModal = document.getElementById('chat-modal');
    const closeModalBtn = document.querySelector('.close-btn');
    const modalChatbox = document.querySelector('.chat-box');
    const modalUserInput = document.getElementById('modal-user-input');
    const modalSendBtn = document.getElementById('modal-send-btn');

    const rasaUrl = 'http://localhost:5005/webhooks/rest/webhook'; // Correct Rasa URL

    chatContainer.addEventListener('click', () => {
        chatModal.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => {
        chatModal.style.display = 'none';
    });

    modalSendBtn.addEventListener('click', sendModalMessage);

    modalUserInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendModalMessage();
        }
    });

    async function sendModalMessage() {
        const message = modalUserInput.value.trim();
        if (message === '') return;

        appendMessage('user', message, modalChatbox);

        const response = await fetch(rasaUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ sender: 'user', message: message })
        });

        const data = await response.json();
        const botMessages = data.map((reply) => ({ sender: 'bot', text: reply.text }));
        botMessages.forEach((msg) => appendMessage('bot', msg.text, modalChatbox));

        modalUserInput.value = '';
    }

    function appendMessage(sender, message, targetChatbox) {
        const messageElement = document.createElement('div');
        messageElement.className = sender === 'user' ? 'user-message' : 'bot-message';
        messageElement.innerText = message;
        targetChatbox.appendChild(messageElement);
        targetChatbox.scrollTop = targetChatbox.scrollHeight;
    }
</script>
</body>
</html>
